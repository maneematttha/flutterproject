name: flutter_order
description: "SkyFLASH - แอปสั่งอาหารจัดส่งด้วยโดรน"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Packages สำหรับการทำงาน ---
  cupertino_icons: ^1.0.2
  get: ^4.6.5
  http: ^1.2.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  supabase_flutter: ^2.12.0
  flutter_dotenv: ^5.2.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # --- การจัดการ Assets ---
  assets:
    - .env
    - assets/images/
