<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyFLASH - Drone GPS Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Kanit', sans-serif; padding: 20px; background: #f5f5f5; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
    button { background: #EC407A; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-bottom: 10px; font-family: 'Kanit'; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .log { background: #333; color: #0f0; padding: 10px; border-radius: 8px; font-family: monospace; height: 300px; overflow-y: auto; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="text-align: center; color: #EC407A;">🚁 Drone Simulator (Web)</h2>
    <p style="text-align: center; color: #666; font-size: 14px;">จำลองการบินของ DRONE-01 แทนการรันด้วย Python</p>
    
    <button id="startBtn" onclick="startSimulation()">🚀 เริ่มการจำลองการบิน (Start Flight)</button>
    
    <div class="log" id="logBox"></div>
  </div>

  <script>
    // Supabase Config (จากไฟล์ .env)
    const supabaseUrl = 'https://igipojhbetjhgufxbvgs.supabase.co';
    const supabaseKey = 'sb_publishable_tEmbm32nMcjG0gVPFQtT8A_Cz64sK8T';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    const RESTAURANT = { lat: 13.7563, lng: 100.5018 };
    const CUSTOMER = { lat: 13.7620, lng: 100.5080 };
    let simInterval = null;

    function log(msg) {
      const b = document.getElementById('logBox');
      b.innerHTML += `<div>${msg}</div>`;
      b.scrollTop = b.scrollHeight;
    }

    async function startSimulation() {
      document.getElementById('startBtn').disabled = true;
      log("🚀 เริ่มภารกิจโดรน: DRONE-01");
      
      let steps = 30;
      let currentStep = 0;
      let battery = 100;

      simInterval = setInterval(async () => {
        if (currentStep > steps) {
          clearInterval(simInterval);
          log("✅ ลงจอดสำเร็จ! (Mission Completed)");
          document.getElementById('startBtn').disabled = false;
          return;
        }

        let ratio = currentStep / steps;
        let currentLat = RESTAURANT.lat + (CUSTOMER.lat - RESTAURANT.lat) * ratio;
        let currentLng = RESTAURANT.lng + (CUSTOMER.lng - RESTAURANT.lng) * ratio;
        let altitude = (currentStep > 0 && currentStep < steps) ? 25.0 : 0.0;
        let speed = (currentStep > 0 && currentStep < steps) ? 12.5 : 0.0;
        battery -= 0.5;

        let status = currentStep < steps ? 'delivering' : 'idle';

        // 1. อัปเดตตาราง drones
        const { error: err1 } = await supabase
          .from('drones')
          .update({ 
            current_lat: currentLat, 
            current_lng: currentLng,
            current_altitude: altitude,
            battery_level: Math.floor(battery),
            speed: speed,
            status: status,
            last_heartbeat: new Date().toISOString()
          })
          .eq('id', 'DRONE-01');

        // 2. บันทึกตาราง drone_telemetry_logs
        const { error: err2 } = await supabase
          .from('drone_telemetry_logs')
          .insert([{
            drone_id: 'DRONE-01',
            lat: currentLat,
            lng: currentLng,
            altitude: altitude,
            battery: Math.floor(battery),
            speed: speed
          }]);

        if (err1 || err2) {
          log(`⚠️ Error: ${err1?.message || ''} ${err2?.message || ''}`);
        } else {
          log(`[${Math.round(ratio*100)}%] พิกัด: ${currentLat.toFixed(5)}, ${currentLng.toFixed(5)} | แบต: ${Math.floor(battery)}%`);
        }

        currentStep++;
      }, 1000); // อัปเดตทุก 1 วินาที
    }
  </script>
</body>
</html>
